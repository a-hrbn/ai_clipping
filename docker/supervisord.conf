[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e -f /etc/ssh/sshd_config
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=/bin/bash -lc "cd /workspace/backend && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
directory=/workspace/backend
user=dev
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/dev",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"

[program:frontend]
command=/bin/bash -lc "cd /workspace/frontend && npm run dev -- --hostname 0.0.0.0 --port 3000"
directory=/workspace/frontend
user=dev
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/dev",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin",NEXT_TELEMETRY_DISABLED="1"
